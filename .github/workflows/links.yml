name: Links

# Checks every link in the list on pull requests and once a week.
on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    links:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: lycheeverse/lychee-action@v2
              id: lychee
              with:
                  # Some government sites refuse bots (403) or rate-limit (429); those aren't dead
                  args: >-
                      --accept '200..=299,403,429'
                      --max-retries 3
                      --timeout 30
                      --user-agent 'Mozilla/5.0 (compatible; awesome-belgian-law link check)'
                      README.md CONTRIBUTING.md
                  fail: false

            # Belgian government sites regularly time out or let a certificate expire for a day.
            # That says nothing about a pull request, so only links that answer with an HTTP
            # error (404, 410, 500...) fail the check. The weekly run reports everything in an issue.
            - name: Fail on dead links
              if: github.event_name != 'schedule'
              run: |
                  test -f lychee/out.md
                  if grep -E '^\* \[[45][0-9]{2}\]' lychee/out.md; then
                      echo "::error::Dead links found, see the list above"
                      exit 1
                  fi

            - name: Open an issue with the weekly report
              if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
              uses: peter-evans/create-issue-from-file@v5
              with:
                  title: Weekly link check found problems
                  content-filepath: ./lychee/out.md
